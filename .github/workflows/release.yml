name: Release

on:
  push:
    tags: [v*]

permissions: {}

jobs:
  release-notes:
    name: Create release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    # checkout can leave the tag lightweight (actions/checkout#882), dropping the release summary.
    - run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
    # tag_pattern matches only vX.Y.Z, so a pre-release such as v0.1.0rc1 gets its tag message as notes.
    - id: kind
      run: |
        if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
        fi
    - uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4.8.0
      if: steps.kind.outputs.prerelease == 'false'
      with:
        version: v2.14.2  # same as the dev environment's git-cliff
        config: pyproject.toml
        args: --latest --strip all
      env:
        OUTPUT: release-notes.md
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md --prerelease="$PRERELEASE"
      env:
        GH_TOKEN: ${{ github.token }}
        PRERELEASE: ${{ steps.kind.outputs.prerelease }}

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # hatch-vcs reads tags for the version
        persist-credentials: false
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        enable-cache: false  # no cache poisoning in a publishing pipeline
    - run: uv build --python 3.14
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: [build, release-notes]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/water-ogcapi
    permissions:
      id-token: write  # trusted publishing and PEP 740 attestations
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
