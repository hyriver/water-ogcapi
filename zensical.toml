[project]
site_name = "water-ogcapi"
site_description = "An async-first Python client for USGS water data services over OGC API Features."
site_url = "https://docs.hyriver.io/water-ogcapi/"
repo_url = "https://github.com/hyriver/water-ogcapi"
repo_name = "hyriver/water-ogcapi"

[project.theme]
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
# docs/index.md includes README.md; paths resolve from the repo root.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
