[project]
site_name = "Water OGC API"
site_description = "A Python client for USGS water data services over OGC API Features, blocking or async."
site_url = "https://docs.hyriver.io/water-ogcapi/"
repo_url = "https://github.com/hyriver/water-ogcapi"
repo_name = "hyriver/water-ogcapi"

# docs/.nav.yml and docs/guide/.nav.yml order the nav (D-87).

[project.theme]
features = [
  "content.code.copy",
  "navigation.footer",
  # docs/examples/index.md is the Examples section page, not a child of it.
  "navigation.indexes",
  "navigation.instant",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
# docs/index.md includes README.md; paths resolve from the repo root.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true

[project.plugins.awesome-nav]

# 0.1.0rc1 links the old URLs from its README and configure_logger() docstring.
[project.plugins.redirects.redirect_maps]
"logging.md" = "guide/logging.md"
"performance.md" = "guide/performance.md"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
# Documents the blocking twins of water_ogcapi._sync as methods.
extensions = ["scripts/griffe_twins.py"]
members_order = "source"
show_source = false
