name: Docs

on:
  push:
    branches: [main]
  pull_request:
  # Refreshes the roadmap page, which is generated from the GitHub milestones.
  schedule:
  - cron: 0 6 * * *
  workflow_dispatch:

permissions:
  contents: read
  issues: read

# Never cancel a Pages deployment mid-flight; superseded PR builds can go.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514  # v0.11.0
      with:
        environments: docs
    # --strict fails the build on warnings such as broken links.
    - run: pixi run docs
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
      with:
        path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      id: deployment
